<!DOCTYPE html>
<html>
<head>
    <title>omila365 Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0e17; color: #d7dee8; }
        .container { background: #111927; padding: 30px; border-radius: 10px; border: 1px solid #1a2a3a; }
        .form-control { background: #0d1520 !important; border: 1px solid #1a2a3a !important; color: #d7dee8 !important; }
        .form-control:focus { border-color: #00ff41 !important; box-shadow: 0 0 20px rgba(0,255,65,0.1) !important; }
        .btn-success { background: #00ff41; border: none; color: #0a0e17; font-weight: 600; }
        .btn-success:hover { background: #00cc33; }
        label { color: #8899aa; font-size: 0.75rem; font-weight: 500; }
        a { color: #00ff41; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .alert { background: #0d1520; border: 1px solid #1a2a3a; }
        .alert-danger { border-color: #ff0044; color: #ff0044; }
        .alert-success { border-color: #00ff41; color: #00ff41; }
    </style>
</head>
<body>
<div class="container mt-5" style="max-width:420px;">
    <h2 class="text-center mb-4" style="color:#00ff41;">Create an Account</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
    </form>
    <p class="mt-3 text-center">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
    </p>
</div>
</body>
</html>
